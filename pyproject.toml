# Dev-tooling config only; NOT a package/build manifest - plugin runs via bare python3 <path>.

[project]
name = "opencode-orchestrator"
version = "0.3.2"
description = "Coordinate reusable monitored headless OpenCode agents from Claude Code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "hassanbaigy" }]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
